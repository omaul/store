<!DOCTYPE html>
<html lang="ru" class="is-booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>РАЯ ДРАГА</title>
  <meta name="description" content="Украшения ручной работы из латуни">
  <meta property="og:title" content="РАЯ ДРАГА">
  <meta property="og:description" content="Украшения ручной работы из латуни">
  <meta property="og:type" content="website">

  <!-- png — фолбэк для браузеров без svg-фавиконок (Safari) -->
  <link rel="icon" href="/icon-32.png" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="robots" content="noai, noimageai">
  <meta name="copyright" content="© 2026 Рая Драга, все права защищены">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Контент скрыт, пока не приедут шрифт и фото первого ряда: иначе видно, как
       подписи перескакивают с системного моно на Plex, а плитки хлопают по одной.
       Класс снимает boot.ts, он же страхует таймаутом. Правило живёт здесь, а не
       в style.css: в дев-режиме бандл CSS приезжает через JS и опаздывает.
       Скрыт именно main — сообщение из <noscript> должно остаться видимым. -->
  <style>html.is-booting main { opacity: 0 }</style>
</head>
<body>
  <main>
    <nav id="nav">
      <div class="nav-left">
        <!-- два штриха складываются в шеврон; видна только когда что-то открыто -->
        <button id="back-btn" class="back-btn" aria-label="Назад" data-state="menu">
          <span class="line line-1"><i></i></span>
          <span class="line line-2"><i></i></span>
        </button>
      </div>

      <div id="filters" class="filters"></div>

      <div class="nav-right">
        <a id="contact-btn" class="icon-btn" href="#" aria-label="Написать" target="_blank" rel="noopener">
          <!-- размер и цвет заданы атрибутами: в дев-режиме CSS приезжает через
               JS, и без них иконка успевает мигнуть огромной и синей -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="#000" stroke-width="2"/>
            <path d="M3.5 6.5 12 13l8.5-6.5" stroke="#000" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
      </div>
    </nav>

    <div class="nav-placeholder"></div>

    <div class="scroll-area">
      <div id="grid" class="product-grid"></div>

      <footer class="footer">
        <ul>
          <!-- «Об авторе», «Размеры» и «Доставка» вернутся, когда будут
               настоящие тексты; заготовки лежат в src/products.ts -->
          <li><a href="#" data-info="care">УХОД ЗА&nbsp;ЛАТУНЬЮ</a></li>
          <li><a href="#" data-info="rights">ПРАВА</a></li>
          <li><a id="footer-contact" href="#" target="_blank" rel="noopener">КОНТАКТЫ</a></li>
        </ul>
        <p class="footer-copy">&copy;&nbsp;2026 Рая Драга. Фотографии и&nbsp;тексты защищены авторским правом</p>
      </footer>
    </div>

    <!-- Описание изделия. Фото здесь нет специально: увеличивается сам тайл
         в сетке, а не открывается его копия — иначе картинка мигает. -->
    <section id="detail" class="detail" aria-hidden="true">
      <!-- слайдер: сами кадры лежат в тайле сетки, здесь только управление -->
      <div id="gallery" class="gallery" hidden>
        <button id="gallery-prev" class="gallery-btn" type="button" aria-label="Предыдущее фото">←</button>
        <p id="gallery-count" class="gallery-count" aria-live="polite"></p>
        <button id="gallery-next" class="gallery-btn" type="button" aria-label="Следующее фото">→</button>
      </div>

      <p id="detail-code" class="detail-code"></p>
      <p id="detail-name" class="detail-name"></p>
      <dl id="detail-specs" class="specs"></dl>
      <button id="note-btn" class="note-btn" type="button" hidden aria-expanded="false" aria-controls="detail-note">ОПИСАНИЕ</button>
      <p id="detail-note" class="detail-note" hidden></p>
      <p id="detail-price" class="detail-price"></p>
      <a id="detail-cta" class="cta" href="#" target="_blank" rel="noopener">НАПИСАТЬ</a>
    </section>

    <!-- текстовые страницы из футера -->
    <section id="info" class="info-panel" aria-hidden="true">
      <div class="info-body">
        <p id="info-title" class="detail-name"></p>
        <div id="info-text" class="info-text"></div>
      </div>
    </section>
  </main>

  <noscript>
    <p style="padding:2rem;text-align:center">Для просмотра каталога нужен JavaScript.</p>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
