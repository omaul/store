<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BRASS</title>
  <meta name="description" content="Кольца ручной работы из латуни">
  <meta property="og:title" content="BRASS">
  <meta property="og:description" content="Кольца ручной работы из латуни">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav id="nav">
      <div class="nav-left">
        <!-- кнопка зума: два штриха превращаются в шеврон «назад» -->
        <button id="zoom-btn" class="zoom-btn" aria-label="Изменить масштаб" data-state="menu">
          <span class="line line-1"><i></i></span>
          <span class="line line-2"><i></i></span>
        </button>
      </div>

      <div id="filters" class="filters"></div>

      <div class="nav-right">
        <a id="contact-btn" class="icon-btn" href="#" aria-label="Написать" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M3.5 6.5 12 13l8.5-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </a>
      </div>
    </nav>

    <div class="nav-placeholder"></div>

    <div class="scroll-area">
      <div id="grid" class="product-grid"></div>

      <footer class="footer">
        <ul>
          <li><a href="#" data-info="about">О мастерской</a></li>
          <li><a href="#" data-info="care">Уход за латунью</a></li>
          <li><a href="#" data-info="sizes">Размеры</a></li>
          <li><a href="#" data-info="delivery">Доставка</a></li>
          <li><a id="footer-contact" href="#" target="_blank" rel="noopener">Контакты</a></li>
        </ul>
      </footer>
    </div>

    <!-- Описание изделия. Фото здесь нет специально: увеличивается сам тайл
         в сетке, а не открывается его копия — иначе картинка мигает. -->
    <section id="detail" class="detail" aria-hidden="true">
      <p id="detail-code" class="detail-code"></p>
      <p id="detail-name" class="detail-name"></p>
      <dl id="detail-specs" class="specs"></dl>
      <p id="detail-note" class="detail-note"></p>
      <p id="detail-price" class="detail-price"></p>
      <a id="detail-cta" class="cta" href="#" target="_blank" rel="noopener">НАПИСАТЬ</a>
    </section>

    <!-- текстовые страницы из футера -->
    <section id="info" class="info-panel" aria-hidden="true">
      <div class="info-body">
        <p id="info-title" class="detail-name"></p>
        <div id="info-text" class="info-text"></div>
      </div>
    </section>
  </main>

  <noscript>
    <p style="padding:2rem;text-align:center">Для просмотра каталога нужен JavaScript.</p>
  </noscript>

  <!-- точка входа; остальные файлы из js/ подтягиваются импортами -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
